<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/logo-navegador.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- === Antes de carregar os elementos, o sistema já busca qual o tema armazenado no LocalStorage === -->

    <script>
      (function () {
        try {
          var tema = localStorage.getItem("sporthub_tema");
          document.documentElement.setAttribute("data-theme", tema === "light" ? "light" : "dark");
        } catch (e) {}
      })();
    </script>

    <style>
      html { background: #071525; }
      html[data-theme="light"] { background: #F1F3F5; }
    </style>

    <title>SportHub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
